name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Build static site
        env:
          GITHUB_PAGES: "1"
          NITRO_PRESET: github_pages
        run: |
          set +e
          npm run build:pages
          echo "--- html ---"
          find .output -name '*.html' | head -20
          echo "--- public ---"
          ls -la .output/public 2>/dev/null | head -30
          if [ -f .output/public/index.html ]; then
            exit 0
          fi
          if [ -f .output/public/404.html ]; then
            cp .output/public/404.html .output/public/index.html
            exit 0
          fi
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
